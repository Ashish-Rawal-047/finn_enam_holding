<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5ED" />
    <title>FINN — Investment Intelligence | ENAM</title>
    <script>
      // Apply the saved theme before the first paint (avoids a light flash for dark-mode users).
      try {
        var t = localStorage.getItem('finn-theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      /* Static splash, painted before any JavaScript loads; React replaces it on its first render. */
      html, body { margin: 0; background: #F7F5ED; }
      html.dark, html.dark body { background: #0E1B16; }
      .finn-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in the fallback font until they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" /></noscript>
  </head>
  <body class="antialiased selection:bg-emerald-900/15 selection:text-emerald-950">
    <div id="root">
      <div class="finn-splash" aria-label="Loading FINN" role="status">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M8.2 28 C9.2 26.2 10.1 24.8 11.2 23.5" stroke="#164E3B" stroke-width="1.8" stroke-linecap="round" />
          <path d="M10.2 23.2 C7 19.2 6.2 14.5 7.2 10.2 C11 12.5 12.8 17.5 10.2 23.2 Z" fill="#187653" />
          <path d="M11 25.5 C11 17 15.8 9.2 24.8 5.2 C24.5 14.5 18.8 22.2 11 25.5 Z" fill="#164E3B" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
